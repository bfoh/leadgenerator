name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every paid integration is blanked so CI can never bill an API, and Supabase is blanked so the
# app runs in demo mode against browser storage only.
env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SUPABASE_URL: ''
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
  GOOGLE_PLACES_API_KEY: ''
  BRAVE_SEARCH_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  SUPABASE_SERVICE_ROLE_KEY: ''
  CRON_SECRET: ''
  RESEND_API_KEY: ''
  RESEND_WEBHOOK_SECRET: ''
  WHATSAPP_ACCESS_TOKEN: ''
  WHATSAPP_APP_SECRET: ''
  WHATSAPP_VERIFY_TOKEN: ''
  MESSAGING_UNSUBSCRIBE_SECRET: ''
  LIVE_INTEGRATION: ''

jobs:
  check:
    name: Typecheck, lint, unit + database tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests plus the RLS suite, which applies the migrations to an in-process Postgres (PGlite).
      - run: npm test
      - run: npm run build
      # Fails if a key format, a service-role token or a configured secret value reaches the browser.
      - run: npm run check:bundle
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end, accessibility and responsive tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
