<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Light study for the courtyard and guest rooms</title>
  <desc id="desc">A Studio-generated elevation and sun-path study, made from the house brief. It is not a measured architectural drawing.</desc>
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171A17"/>
      <stop offset="1" stop-color="#222622"/>
